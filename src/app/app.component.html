<header class="app-header">
	<div class="app-brand">
		<span class="app-brand__mark" aria-hidden="true">CR</span>
		<div>
			<h1>Change Request Review</h1>
			<p class="app-brand__sub">Purchase agreement amendments</p>
		</div>
	</div>
	<label class="app-user">
		<span class="app-user__label">Acting as</span>
		<select (change)="switchUser($any($event.target).value)">
			<option *ngFor="let key of userKeys" [value]="key" [selected]="session.user.id === users[key]?.id">{{ key }}</option>
		</select>
	</label>
</header>

<main class="app-layout" *ngIf="show">
	<app-cr-list #list [selectedId]="selectedId" (select)="onSelect($event)"></app-cr-list>
	<app-cr-detail *ngIf="selectedId" [id]="selectedId" (changed)="list.load()"></app-cr-detail>
</main>
